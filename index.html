<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hydrangea Essence || Perfumeria</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header">
       <img src="img/logo.png" alt="Hydrangea Essence Logo" class="header__logo">
       <h1 class="header__title">Hydrangea Essence</h1>

       <nav class="nav">
        <a href="#home">Inicio</a>
        <a href="#popular">Populares</a>
        <a href="#products">Perfumes</a>
        <a href="#favorites">Mis Favoritos</a>
       </nav>
    </header>

    <main>
        <section id="home" class="section home">
            <h1>Bienvenido a nuestra tienda</h1>
            <p>Descubre nuestra exclusiva colección de perfumes</p>
        </section>

        <section id="popular" class="section">
            <h2>Perfumes Populares</h2>
            <div id="popularList" class="grid"></div>
        </section>

        <section id="products" class="section">
            <h2>Todos los Perfumes</h2>
            <div id="productList" class="grid"></div>
        </section>

        <section id="favorites" class="section">
            <h2>Mi Perfil</h2>
            <div id="loginBox">
                <input type="email" id="email" placeholder="Correo">
                <input type="password" id="password" placeholder="Contraseña">
                <button id="loginBtn">Iniciar sesión</button>
            </div>

            <div id="userBox" class="hidden">
                <p id="welcomeUser"></p>
                <button id="logoutBtn">Cerrar sesión</button>
            </div>

            <h3>Mis Favoritos</h3>
            <div id="favoriteList" class="grid"></div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Hydrangea Essence. Todos los derechos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
